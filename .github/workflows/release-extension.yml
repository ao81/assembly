name: Release CASL II extension
on:
  push:
    branches: [main]
    paths: ['extension/**', '.github/workflows/release-extension.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-casl2
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: extension
      - run: pnpm test
        working-directory: extension
      - run: pnpm run package
        working-directory: extension
      - name: Publish VSIX
        working-directory: extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving existing assets unchanged."
            exit 0
          fi
          gh release create "$TAG" "casl2-trace-$VERSION.vsix" --target "$GITHUB_SHA" --title "CASL II 実行トレース $VERSION" --notes "publisherをao81に変更（識別子: ao81.casl2-trace）。0.1.9以前を入れている場合は古い方をアンインストールしてください。導入方法はextension/README.mdを参照してください。"
